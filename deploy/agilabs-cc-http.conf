# agilabs.cc, port 80. Two jobs only: answer the ACME challenge so certbot can
# issue a certificate, and send everything else to https. Enabled first, before
# the certificate exists, because certbot --webroot needs it to be live.
server {
    listen 80;
    listen [::]:80;
    server_name agilabs.cc www.agilabs.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / { return 301 https://agilabs.cc$request_uri; }
}
