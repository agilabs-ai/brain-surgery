# LEGACY DISABLED CONFIG: agilabs.cc is not an approved Edge production target.
# Do not enable this file without an explicit destination decision and config review.
# agilabs.cc: the former Brain Surgery preview, behind HTTP basic auth.
#
# The gate is the point. This is a private preview of an unlaunched product,
# so nothing here should be indexable or linkable by anyone who was not handed
# the password.
#
# Enabled only after certbot has issued the certificate: see enable-agilabs.sh.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.agilabs.cc;

    ssl_certificate     /etc/letsencrypt/live/agilabs.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agilabs.cc/privkey.pem;

    return 308 https://agilabs.cc$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agilabs.cc;

    ssl_certificate     /etc/letsencrypt/live/agilabs.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agilabs.cc/privkey.pem;

    root /var/www/agilabs-brain-surgery;
    index index.html;
    absolute_redirect off;

    auth_basic "Brain Surgery preview";
    auth_basic_user_file /etc/nginx/agilabs.htpasswd;

    access_log /var/log/nginx/agilabs.access.log;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # A gated preview has no business in an index, and robots.txt is served
    # without the auth challenge so a crawler can read the refusal.
    location = /robots.txt {
        auth_basic off;
        add_header Content-Type "text/plain" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # The product is the whole of this site, so the product's own name is a
    # usable way to hand the link to someone: agilabs.cc/brain-surgery lands on
    # the same page as the root.
    #
    # Both are exact matches on purpose. A prefix match would also swallow
    # /brain-surgery.zip, which is the download, and turn it into a redirect to
    # the page the visitor is already on.
    location = /brain-surgery  { return 301 /; }
    location = /brain-surgery/ { return 301 /; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /brain-surgery.zip {
        add_header Content-Disposition "attachment; filename=brain-surgery.zip" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
