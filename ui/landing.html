mple-pill\">Preview data<\/span><\/div><div class=\"output-pair\"><div class=\"output-panel \"><div class=\"output-top\"><span>CURRENT SETUP<\/span><span class=\"output-score\">50%<\/span><\/div><div class=\"output-body\"><div class=\"doc-kicker\">WEEKLY UPDATE / 19 SEPTEMBER<\/div><h3>Product update.<\/h3><p>The team made good progress this week. The launch is nearly ready and the rollout is being discussed.<\/p><p>We are waiting on an external review. Some follow-up is needed before the next release.<\/p><div class=\"doc-issue\">No decision deadline or source reference.<\/div><\/div><\/div><div class=\"output-panel blue-frame\"><div class=\"output-top\"><span>WITH SURGERY<\/span><span class=\"output-score\">100%<\/span><\/div><div class=\"output-body\"><div class=\"doc-kicker\">WEEKLY UPDATE / 19 SEPTEMBER<\/div><h3>Launch is ready.<br>One decision remains.<\/h3><div class=\"doc-row\"><span>Release<\/span><b>Ready for 22 September<\/b><\/div><div class=\"doc-row\"><span>Blocker<\/span><b>Review may delay release<\/b><\/div><div class=\"doc-highlight\"><b>Decision needed by Friday<\/b><br>Sara to approve the revised rollout.<br>Source: notes / N-12.<\/div><\/div><\/div><\/div><div class=\"pair-caption\"><span>Blocker, owner, and deadline are now explicit.<\/span><button class=\"text-link\" data-action=\"task\" data-task=\"t1\">See the evidence<svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14m-5-5 5 5-5 5\"/><\/svg><\/button><\/div><\/section>\n<section class=\"section\" id=\"how\"><div class=\"section-head\"><div><p class=\"kicker\">HOW WE TEST<\/p><h2>Same task. Same model.<br>With and without the surgery.<\/h2><\/div><\/div><div class=\"method-figure\"><div class=\"method-input\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6\"/><\/svg> Your task + files<\/div><div class=\"method-fork\"><\/div><div class=\"method-arms\"><div class=\"method-arm\"><div class=\"kicker\">Without the surgery<\/div><strong>Current setup<\/strong><div class=\"method-mini\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/div><small>Existing skills and instructions<\/small><\/div><div class=\"method-arm tested\"><div class=\"kicker blue\">With the surgery<\/div><strong class=\"blue\">Proposed setup<\/strong><div class=\"method-mini\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/div><small>With targeted edits<\/small><\/div><\/div><div class=\"method-join\"><\/div><div class=\"method-check\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m5 12 4 4L19 6\"/><\/svg> Same success checklist<\/div><\/div><p class=\"method-caption\">Same task, inputs, model, and checks. Only the setup changes.<\/p><div class=\"evidence-links\"><button class=\"text-link\" data-action=\"score\" >How scoring works<svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14m-5-5 5 5-5 5\"/><\/svg><\/button><button class=\"text-link\" data-action=\"scope\" >What changes<svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14m-5-5 5 5-5 5\"/><\/svg><\/button><\/div><\/section>\n<section class=\"section\"><div class=\"faq\"><div class=\"section-head\"><div><p class=\"kicker\">BEFORE YOU START<\/p><h2>Before your brain scan.<\/h2><\/div><\/div><details><summary>What does the surgery change?<\/summary><p>Skills and the routing rules that activate them. Edits can fix a skill, resolve conflicts, or reversibly disable it. You approve every change. Provider system prompts and safety settings stay unchanged.<\/p><\/details><details><summary>How are tasks selected and scored?<\/summary><p>Recent work reveals recurring problems. Separate replayable tasks test the fixes, including tasks that already worked. We score each against a fixed requirements checklist, then average the task scores. This measures tested work, not intelligence.<\/p><\/details><details><summary>How long, and how much usage?<\/summary><p>See the tasks, time estimate, and usage budget before testing. Tests and grading use your configured account, within approved limits. More usage needs approval.<\/p><\/details><details><summary>What stays private?<\/summary><p>Your report stays local. Selected excerpts and inputs may reach your configured model provider. Sharing includes only your approved summary, not private conversations, files, prompts, or skills.<\/p><\/details><details><summary>Can I undo the changes?<\/summary><p>Yes. Your agent keeps originals and checks file versions before applying or undoing the reviewed plan. This prototype changes no real files.<\/p><\/details><\/div><\/section><section class=\"end-cta\"><div class=\"cloud-layer\" data-cloud=\"sides\" data-intensity=\"0.33\" aria-hidden=\"true\"><\/div><div class=\"foreground\"><span class=\"hero-cross\"><\/span><h2>What could your AI gain?<\/h2><button class=\"btn btn-dark\" data-action=\"copy-prompt\" >Copy prompt<svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M15 8V4H4v11h4\"/><\/svg><\/button><p class=\"note\">One prompt. Your agent. Your work.<\/p><\/div><\/section><\/main><div class=\"wrap\"><footer class=\"footer\"><span>Brain Surgery, by Edge.<\/span><div><button class=\"\" data-action=\"privacy\" >Privacy<\/button><button class=\"\" data-action=\"method\" >Method<\/button><a href=\"https://github.com/agilabs-ai/brain-surgery\" target=\"_blank\" rel=\"noreferrer\">Source ↗<\/a><\/div><\/footer><\/div>", "report": "<div class=\"wrap\"><nav class=\"nav\" aria-label=\"Main navigation\"><a class=\"brand\" href=\"#landing\" data-route=\"landing\"><svg class=\"edge-logo\" viewBox=\"0 0 102 94\" aria-hidden=\"true\"><g fill=\"currentColor\" transform=\"translate(12 12)\"><path d=\"M1 43 42 28v27L1 70V43ZM34 17 78 0v28L47 40V23l-13 5V17Z\"/><\/g><\/svg>Edge<span class=\"brand-divider\"><\/span><span class=\"brand-product\">Brain Surgery<\/span><\/a><div class=\"nav-links\"><s (()=>{'use strict';
const VERT='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const FRAG=`precision highp float;
uniform vec2 size;uniform float t;uniform float ratio;uniform float intensity;uniform float kind;
vec3 permute(vec3 x){return mod(((x*34.)+1.)*x,289.);}
float noise(vec2 v){const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);vec2 i1=x0.x>x0.y?vec2(1.,0.):vec2(0.,1.);vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=mod(i,289.);vec3 p=permute(permute(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);m=m*m;m=m*m;vec3 x=2.*fract(p*C.www)-1.;vec3 h=abs(x)-.5;vec3 ox=floor(x+.5);vec3 a0=x-ox;m*=1.79284291400159-.85373472095314*(a0*a0+h*h);vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;return 130.*dot(m,g);}
float bayer2(vec2 a){a=floor(a);return fract(a.x*.5+a.y*a.y*.75);}
float bayer4(vec2 a){return bayer2(.5*a)*.25+bayer2(a);}
void main(){float px=3.*ratio;vec2 cell=gl_FragCoord.xy/px;vec2 snap=(floor(cell)+.5)*px;vec2 uv=snap/size;vec2 p=(snap-.5*size)/(ratio*410.);float n=.5*noise(p-vec2(0.,.30*t))+.5*noise(2.*p+vec2(.06*t,.32*t));float sh=smoothstep(.18,.78,.5+.5*n);float side=pow(abs(uv.x-.5)*2.,1.1);float ymask=smoothstep(0.,.12,uv.y)*(1.-smoothstep(.78,1.,uv.y));float hole=smoothstep(.12,.45,abs(uv.x-.5));float mask=ymask*(.18+.82*side)*hole;if(kind>.5){mask=ymask*smoothstep(.2,.75,uv.x)*.95;}float on=step(.5,sh*.65+bayer4(cell)-.5);float a=on*mask*intensity;gl_FragColor=vec4(vec3(.08235,.298,.999)*a,a);}`;

'use strict';
const BrainSurgery=(()=>{
 const DATA=JSON.parse(document.getElementById('app-data').textContent);

 const arrow='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>';
 const prompt='Run Brain Surgery using https://github.com/agilabs-ai/brain-surgery. Read SKILL.md first. Inspect my permitted recent work and installed skills, propose a small set of changes, and compare my current setup with the proposed setup on separate tasks. Show the time and usage plan before any evaluation. Keep my live setup unchanged and my report private until I explicitly approve otherwise.';
 const actions={};
 function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3400);}
 async function copy(text,msg='Copied.'){try{await navigator.clipboard.writeText(text);toast(msg);}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(ok)toast(msg);else{download(text,'text/plain','brain-surgery-prompt.txt');toast('Clipboard blocked. Text saved.');}}}
 function download(value,type,name){const b=value instanceof Blob?value:new Blob([value],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
 function show(title,body,kicker='',sub=''){const d=$('#main-dialog');$('#dialog-content').innerHTML=`<div class="dialog-head"><div>${kicker?`<p class="kicker">${kicker}</p>`:''}<h2 id="dialog-title">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="close" data-action="close" aria-label="Close dialog">×</button></div>${body}`;if(!d.open)d.showModal();document.body.classList.add('modal-open');d.scrollTop=0;}

 function route(key,{scroll=true}={}){if(!PAGES[key]){if(window.BS_PUBLIC_ONLY){toast('This export contains the public summary only.');return;}key='landing';}close();window.Clouds?.clear();current=key;$('#app').innerHTML=PAGES[key];$$('.preview-dock a').forEach(a=>{const on=a.dataset.route===key;a.classList.toggle('active',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');});document.title=({'landing':'Give your AI brain surgery','report':'Federico’s private brain scan','public':'Federico’s public brain scan','scan':'Brain Surgery | Terminal preview','social':'Brain Surgery | Social preview'})[key]+' · AGI Labs';if(scroll)window.scrollTo(0,0);window.Clouds?.mountAll();if(key==='scan'&&actions['terminal-reset'])actions['terminal-reset']();if(key==='report'&&actions['sync-report-state'])actions['sync-report-state']();if(key==='public'&&window.BS_SHARED_PREVIEW)updatePublicView();}

 function method(){show('Same task. Different setup.',`<div class="text-block"><p>We test the current setup against a fixed bundle of edits. Task, files, model, tools, and checks stay the same.</p><p>History reveals possible fixes. Separate tasks test them, including tasks that already worked.</p><p>The score averages requirements met across tasks. Completion, skill use, speed, and usage are separate.</p></div><div class="dialog-actions"><button class="btn btn-dark" data-action="score">How scoring works ${arrow}</button></div><p class="dialog-note">Sample data only. No evaluation ran.</p>`,'HOW WE TEST');}
 function score(){show('What does 85% mean?',`<p class="text-block">Requirements met, averaged across four tasks.</p><div class="score-calc"><div><p class="kicker">CURRENT SETUP</p><p class="tile-num">60<span style="font-size:19px">%</span></p><p class="note" style="margin-top:10px">(50 + 50 + 100 + 40) ÷ 4</p></div><div style="background:#f8faff;border-color:#dae4ff"><p class="kicker">WITH SURGERY</p><p class="tile-num blue">85<span style="font-size:19px">%</span></p><p class="note" style="margin-top:10px">(100 + 100 + 100 + 40) ÷ 4</p></div></div><table class="data-table"><thead><tr><th>Per requirement</th><th>Credit</th><th>Meaning</th></tr></thead><tbody><tr><td>Met</td><td>1</td><td><span class="note">Requirement met.</span></td></tr><tr><td>Partly met</td><td>0.5</td><td><span class="note">Partial credit, defined before testing.</span></td></tr><tr><td>Not met</td><td>0</td><td><span class="note">Requirement not met.</span></td></tr></tbody></table><div class="text-block"><p>Each task uses a fixed checklist and counts equally. <strong>Fully completed</strong> means every mandatory requirement is met.</p><p>85 − 60 = 25 percentage points. This measures tested work, not intelligence. Skill use and tokens are separate.</p></div><details class="req-detail"><summary>Metric and grading details</summary><div class="inside">Metric: task_requirement_fulfillment_v1 (proposed). Equal requirement weights; one attempt per configuration. Task 1 uses preset half-credit rules. Other tasks use binary checks. All scores are preview data.</div></details>`,'ABOUT THE NUMBER');}
 function community(){show('Compare gains, not brains.',`<div class="score-calc"><div><p class="kicker">AVERAGE SHARED GAIN</p><p class="tile-num">+18 <span style="font-size:15px">points</span></p><p class="note">96 comparable sample reports.</p></div><div><p class="kicker">FEDERICO’S SAMPLE GAIN</p><p class="tile-num blue">+25 <span style="font-size:15px">points</span></p><p class="note">7 points above average.</p></div></div><div class="text-block"><p>128 shared scans and 96 comparable reports are sample data, not live counts.</p><p>The proposed average uses eligible, consenting reports with matching scoring and sampling rules. Include gains, ties, and losses. Deduplicate by published rules, not each person’s best run.</p><p>People test different work. A bigger gain does not mean a better final setup. Federico is excluded from his comparison average.</p><p>“Scans shared” counts published reports, not clicks, people, or upgrades.</p></div>`,'COMMUNITY DATA');}

 function scope(){show('Small edits. Same AI.',`<div class="text-block"><p><strong>Improve a skill.</strong> Fix its trigger, procedure, or references.</p><p><strong>Fix the routing.</strong> Add a scoped routing rule or resolve conflicting guidance.</p><p><strong>Remove interference.</strong> Narrow or reversibly disable a skill when the full-setup test supports it.</p><p><strong>Fill a real gap.</strong> Test public candidates within the approved scope and budget before installing.</p><p>Test the bundle with normal activation. Provider instructions, safety, and permissions stay intact.</p></div>`,'WHAT SURGERY CHANGES');}
 function prototype(){show('Explore the prototype.',`<div class="text-block"><p>The bottom bar opens all five screens. Explore evidence, edits, simulated runs, and local exports.</p><p>Scores, sessions, usage, outputs, edits, and community counts are samples. Federico’s real evaluation and live community data are not connected.</p><p>The approved AGI Labs identity, palette, brain, and blue pixel-cloud treatment are preserved.</p><p>Simulations change no files and upload nothing. The copy prompt is a real agent handoff, not an automatic install.</p></div><div class="dialog-actions"><button class="btn btn-dark" data-action="close">Explore the design</button></div>`,'PROTOTYPE NOTES');}
 function getSocial(name){let s=$('#social-template').textContent;const display=name||S.display_name||'Anonymous';if(display!=='Federico')s=s.replaceAll('FEDERICO’S','YOUR').replaceAll("Federico's",'Your');return s;}

gery review','surgery')}${button('Keep current setup','close','btn btn-outline')}</div>`,'CONFLICT PREVIEW'),'undo':()=>show('Restore the original setup?',`<p class="text-block">Check post-apply file versions, then restore originals. Stop on a conflict.</p><div class="dialog-actions">${button('Simulate undo','simulate-undo')}${button('Cancel','close','btn btn-outline')}</div><p class="dialog-note">Resets preview state only.</p>`,'UNDO PREVIEW'),'simulate-undo':()=>{appState='reverted_preview';syncReport();close();toast('Preview reverted. Real files unchanged.');},'sync-report-state':syncReport,'save-outputs':el=>{const t=D.tasks.find(t=>t.id===el.dataset.task);B.download('SYNTHETIC DESIGN OUTPUTS, NOT REAL SESSION EVIDENCE\n\nCURRENT\n'+t.output_before+'\n\nWITH SURGERY\n'+t.output_after,'text/plain',`${t.id}-preview-outputs.txt`);},'terminal-reset':preflight,'terminal-start':start,'terminal-details':details,'terminal-use-plan':()=>{oneModel=!!$('#one-model')?.checked;close();preflight(true);const el=$('#terminal-content');if(oneModel){el.innerHTML=el.innerHTML.replace('Current + comparison model','Current model only').replace('Up to 16','Up to 8');}toast('Plan updated. No evaluation started.');},'terminal-partial':partial,'terminal-blocked':blocked,'terminal-empty':empty,'terminal-cancel':()=>{stopTimer();B.navigate('landing');toast('Preview cancelled. Nothing ran.');},'terminal-report':()=>{B.navigate('report');if(oneModel)setTimeout(()=>{const section=$('.model-grid')?.closest('.report-section');section?.remove();},10);},'partial-report':()=>{show('Three complete task pairs.',`<p class="text-block">Three complete pairs: 66.7% → 100%. Task 4 and the model comparison are incomplete.</p><table class="data-table"><thead><tr><th>Complete task</th><th>Current</th><th>Tested</th></tr></thead><tbody>${D.tasks.slice(0,3).map(t=>`<tr><td>${escape(t.title)}</td><td>${t.score_before}%</td><td>${t.score_after}%</td></tr>`).join('')}</tbody></table><p class="dialog-note">Partial preview, not the full score. Excluded from the community average.</p>`,'INCOMPLETE EVALUATION');}});
