name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run full test suite
        run: python -m pytest -q
      - name: Test Agent Skills Gap analyzer
        run: node tests/test_gap_analyzer.js
      - name: Build distributable and run secret scan
        run: scripts/package.sh "$RUNNER_TEMP/brain-surgery-dist"
      - name: Stage labeled design preview without publishing
        run: deploy/publish.sh --build-only "$RUNNER_TEMP/brain-surgery-preview"
      - name: Verify publisher refusal and privacy tests
        run: python -m pytest -q tests/test_share_publish.py tests/test_render_scan.py tests/test_approved_report_ui.py
